<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <title>Bruno Laizans — Software Engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#131313" />
      <stop offset="1" stop-color="#0a0a0a" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- registration hairlines, echoing the hero's column grid -->
  <line x1="200" y1="0" x2="200" y2="630" stroke="#f0f0f0" stroke-opacity="0.08" stroke-width="1" />
  <line x1="600" y1="0" x2="600" y2="630" stroke="#f0f0f0" stroke-opacity="0.08" stroke-width="1" />
  <line x1="1000" y1="0" x2="1000" y2="630" stroke="#f0f0f0" stroke-opacity="0.08" stroke-width="1" />

  <!-- accent rule -->
  <rect x="80" y="150" width="64" height="4" fill="#1b32ff" />

  <!-- eyebrow, mono -->
  <text x="80" y="128" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace"
        font-size="20" letter-spacing="0.08em" fill="#828eff">
    SOFTWARE ENGINEER — AARHUS, DENMARK
  </text>

  <!-- name, poster face -->
  <text x="76" y="330" font-family="'Anton', 'Arial Narrow', sans-serif"
        font-size="128" letter-spacing="-0.01em" fill="#f0f0f0">
    BRUNO
  </text>
  <text x="76" y="450" font-family="'Anton', 'Arial Narrow', sans-serif"
        font-size="128" letter-spacing="-0.01em" fill="#f0f0f0">
    LAIZANS
  </text>

  <!-- tagline, display font -->
  <text x="80" y="512" font-family="'Instrument Sans', Arial, sans-serif"
        font-size="26" fill="#a8a8a8">
    I build and test software that holds up in production.
  </text>

  <!-- footer meta row -->
  <text x="80" y="576" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace"
        font-size="18" letter-spacing="0.04em" fill="#7a7a7a">
    blaizans.vercel.app
  </text>
  <text x="1120" y="576" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace"
        font-size="18" letter-spacing="0.04em" fill="#7a7a7a" text-anchor="end">
    TESTING · BACKEND · FRONTEND
  </text>
</svg>
